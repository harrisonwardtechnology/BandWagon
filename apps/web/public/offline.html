<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#071a33" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1422" media="(prefers-color-scheme: dark)">
    <title>BandWagon Is Offline</title>
    <style>body{margin:0;background:#f4f7fb;color:#101b33;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:560px;background:white;border:1px solid #d9e1ef;border-radius:20px;padding:28px;box-shadow:0 12px 30px rgba(16,27,51,.08)}h1{margin-top:0}p{line-height:1.6;color:#475569}button{min-height:44px;padding:10px 16px;border:0;border-radius:10px;background:#101b33;color:white;font:inherit;font-weight:800;cursor:pointer}button:focus-visible{outline:3px solid #f5a800;outline-offset:3px}@media (prefers-color-scheme: dark){body{background:#0b1422;color:#f1f5f9}.card{background:#121e31;border-color:#25354d;box-shadow:0 12px 30px rgba(0,0,0,.35)}p{color:#b8c4d4}button{background:#f5a800;color:#071a33}}</style>
  </head>
  <body><main class="card"><h1>You’re Offline</h1><p>BandWagon does not cache household, ride, location, or account data for offline use. Reconnect to safely load current information.</p><button type="button" onclick="location.reload()">Try Again</button></main></body>
</html>
