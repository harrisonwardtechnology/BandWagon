services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: bandwagon
      POSTGRES_USER: bandwagon
      POSTGRES_PASSWORD: bandwagon-dev-only
    ports:
      - "5432:5432"
    volumes:
      - bandwagon_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  bandwagon_pg:
