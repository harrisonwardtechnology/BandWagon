name: Web Build

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-build.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/web-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: bandwagon_test
          POSTGRES_USER: bandwagon
          POSTGRES_PASSWORD: bandwagon-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bandwagon -d bandwagon_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://bandwagon:bandwagon-test-only@localhost:5432/bandwagon_test
          DATABASE_SSL: "false"
        run: npm run db:migrate

      - name: Verify database schema
        env:
          DATABASE_URL: postgresql://bandwagon:bandwagon-test-only@localhost:5432/bandwagon_test
          DATABASE_SSL: "false"
        run: npm run db:verify

      - name: Verify migrations are repeatable
        env:
          DATABASE_URL: postgresql://bandwagon:bandwagon-test-only@localhost:5432/bandwagon_test
          DATABASE_SSL: "false"
        run: npm run db:migrate

      - name: Unit tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
