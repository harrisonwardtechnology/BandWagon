name: Production Synthetic

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      # Not configured is not a failure: skip with a notice instead of a red run every hour.
      - name: Check configuration
        id: config
        env:
          SYNTHETIC_BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$SYNTHETIC_BASE_URL" ]; then
            echo "::notice title=Synthetic check skipped::Set the repository variable PRODUCTION_URL to turn on the scheduled synthetic checks."
            echo "Synthetic check skipped: the repository variable PRODUCTION_URL is not set." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify live, ready, and deep health
        if: steps.config.outputs.configured == 'true'
        env:
          SYNTHETIC_BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.SYNTHETIC_BASE_URL.replace(/\/$/, "");
          async function check(path) {
            const response = await fetch(`${base}${path}`, { signal: AbortSignal.timeout(15000) });
            const body = await response.json();
            if (!response.ok || body.ok !== true) throw new Error(`${path} failed with HTTP ${response.status}`);
            return body;
          }
          const live = await check("/api/health/live");
          const ready = await check("/api/health/ready");
          const deep = await check("/api/health/deep");
          if ((deep.summary?.failed || 0) > 0) throw new Error(`Deep health has ${deep.summary.failed} failed checks`);
          console.log(JSON.stringify({ live: live.status, ready: ready.status, deep: deep.status, summary: deep.summary }));
          NODE
